name: Release
on:
  push:
    tags: ["*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install modules
        run: npm install

      - name: Type check, build and verify output
        run: npm run check

      - name: Read manifest version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        if: github.ref_type == 'tag'
        run: |
          if [ "${{ steps.version.outputs.version }}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Build release notes from the change log
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            main.js
            manifest.json
            styles.css
